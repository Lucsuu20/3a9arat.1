<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3A9ARAT - sign in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/img/3A9ARAT (1)-Photoroom.png">
</head>
<body>
    <header>

        <div class="logo">
            <a  class="logo">3A9ARAT</a>
        </div>

       <nav>

            <button class="navbtn" type="button" id="home-navbtn">
                Home
            </button>

            <button class="navbtn" type="button" id="searchproperty-navbtn">
                Search Property
            </button>

            <button class="navbtn" type="button" id="map-navbtn">
                Map
            </button>

            <hr>

            <button id="settings" type="button">
                <img src="/img/setting.png" alt="Settings" class="settings-img">
            </button>

            <a id="sign" type="button" href="signin.html">
                Sign in
            </a>

        </nav>


    </header>
    <div class="space" style="height:200px;"></div>
<div class="main-container" id="mainContainer">
    <div class="signin-form">
        <form>
            <h1>
                Sign in
            </h1>
            <button id="google" type="button">Continue with google</button>
            <input type="email" placeholder="Enter your email" class="loginput" required>
            <input type="password" placeholder="Enter your password" class="loginput" required>
            <button type="submit" id="submit">submit</button>
        </form>
    </div>
    <div class="signup-form">
        <form>
            <h1>Create Account</h1>
            <input type="text" placeholder="Enter your name" class="loginput" required>
            <input type="email" placeholder="Enter your email" class="loginput" required>
            <input type="password" placeholder="Enter your password" class="loginput" required>
            <button type="submit" id="submit-signup">Submit</button>
        </form>
  </div>
  <div class="welcome-right">
        <h1 id="overlay-title">
            Welcome back
        </h1>
        <p class="overlay-p" id="overlay-p">register with your personal details to use all of site features</p>
        <button id="signup">Sign up</button>
  </div>
</div>

    <div class="settings-menu" >
        <nav>
            <h1>Settings</h1>
            <button id="exit-settings-menu"><img src="/img/exit.png" alt="exit" ></button>
        </nav>
       
        <hr>
        <nav>
        <label for="language">choose language</label>
        <select name="language" id="language">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
            <option value="fr">French</option>
        </select>
        </nav>
        <nav>
        <label for="display">Display</label>
        <select name="display" id="display">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
        </nav>
        <hr>
        <div class="pfp-settings"><img src="/img/hiii hello.jpg" alt="Profile Picture">
            <p>Account</p>
        </div>
        
        <h3>
            switch job
        </h3>
        <nav id="settings-job-nav">
            <button>seller</button>
            <button>consumer</button>
        </nav>
        <button id="log-out">Log out</button>
        
    </div>
    <div class="errorMessage">
        <h1 id="error-h"></h1>
        <p id="error-p"></p>
    </div>
    <script src="./js/pages.js"></script>
    <script src="./js/signin.js"></script>
</body>
</html>
