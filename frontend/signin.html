<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3A9ARAT - sign in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/img/3A9ARAT (1)-Photoroom.png">
</head>
<body>
    <header>

        <div class="logo">
            <a  class="logo">3A9ARAT</a>
        </div>

       <nav>

            <button class="navbtn" type="button" id="home-navbtn">
                <span data-i18n="home">Home</span>
            </button>

            <button class="navbtn" type="button" id="searchproperty-navbtn">
                <span data-i18n="searchProperty">Search Property</span>
            </button>

            <button class="navbtn" type="button" id="map-navbtn">
                <span data-i18n="map">Map</span>
            </button>

            <hr>

            <button id="settings" type="button">
                <img src="/img/setting.png" alt="Settings" class="settings-img">
            </button>

            <a id="sign" type="button" href="signin.html">
                <span data-i18n="signIn">Sign in</span>
            </a>

        </nav>


    </header>
    <div class="space" style="height:200px;"></div>
<div class="main-container" id="mainContainer">
    <div class="signin-form">
        <form id="signinForm">
            <h1>
                <span data-i18n="signIn">Sign in</span>
            </h1>
            <button id="google" type="button" data-i18n="continueGoogle">Continue with google</button>
            <input type="email" placeholder="Enter your email" data-i18n-placeholder="enterEmail" class="loginput" required>
            <input type="password" placeholder="Enter your password" data-i18n-placeholder="enterPassword" class="loginput" id="password" required>
            <button type="submit" id="submit" data-i18n="submit">submit</button>
        </form>
    </div>
    <div class="signup-form">
        <form id="signupForm">
            <h1 data-i18n="createAccount">Create Account</h1>
            <input type="text" placeholder="Enter your name" data-i18n-placeholder="enterName" class="loginput" required>
            <input type="email" placeholder="Enter your email" data-i18n-placeholder="enterEmail" class="loginput" required>
            <input type="password" placeholder="Enter your password" data-i18n-placeholder="enterPassword" class="loginput" required>
            <button type="submit" id="submit-signup" data-i18n="submit">Submit</button>
        </form>
  </div>
  <div class="welcome-right">
        <h1 id="overlay-title">
            <span data-i18n="welcomeBack">Welcome back</span>
        </h1>
        <p class="overlay-p" id="overlay-p" data-i18n="registerDetails">register with your personal details to use all of site features</p>
        <button id="signup" data-i18n="signUp">Sign up</button>
  </div>
</div>

    <div class="settings-menu" >
        <nav>
            <h1 data-i18n="settings">Settings</h1>
            <button id="exit-settings-menu"><img src="/img/exit.png" alt="exit" ></button>
        </nav>
       
        <hr>
        <nav>
        <label for="language" data-i18n="chooseLanguage">choose language</label>
        <select name="language" id="language">
            <option value="en" data-i18n="english">English</option>
            <option value="ar" data-i18n="arabic">Arabic</option>
            <option value="fr" data-i18n="french">French</option>
        </select>
        </nav>
        <nav>
        <label for="display" data-i18n="display">Display</label>
        <select name="display" id="display">
            <option value="light" data-i18n="light">Light</option>
            <option value="dark" data-i18n="dark">Dark</option>
        </select>
        </nav>
        <hr>
        <div class="pfp-settings"><img src="/img/hiii hello.jpg" alt="Profile Picture">
            <p data-i18n="account">Account</p>
        </div>
        
        <h3>
            <span data-i18n="switchJob">switch job</span>
        </h3>
        <nav id="settings-job-nav">
            <button data-i18n="seller">seller</button>
            <button data-i18n="consumer">consumer</button>
        </nav>
        <button id="log-out" data-i18n="logOut">Log out</button>
        
    </div>
    <div class="errorMessage">
        <h1 id="error-h">error</h1>
        <p id="error-p">error</p>
    </div>
    <script src="./js/pages.js"></script>
    <script src="./js/signin.js"></script>
</body>
