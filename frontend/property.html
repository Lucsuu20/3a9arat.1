<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3A9ARAT - property</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/img/3A9ARAT (1)-Photoroom.png">
</head>
<body>
    <header>

        <div class="logo">
            <a  class="logo">3A9ARAT</a>
        </div>

       <nav>

            <button class="navbtn" type="button" id="home-navbtn">
                Home
            </button>

            <button class="navbtn" type="button" id="searchproperty-navbtn">
                Search Property
            </button>

            <button class="navbtn" type="button" id="map-navbtn">
                Map
            </button>

            <hr>

            <button id="settings" type="button">
                <img src="/img/setting.png" alt="Settings" class="settings-img">
            </button>

            <a id="sign" type="button" href="signin.html">
                Sign in
            </a>

        </nav>


    </header>
    <div class="space" style="height: 100px;"></div>
    <main class="property-main">
        <div class="property-main-left">
            <h1>Charming Queen Anne House</h1>
            <p> F3 house near the beach and the city center, with a beautiful view of the sea and the mountains.</p>
            <figure>
                <img src="/img/Tour a Charming Queen Anne House in Defiance, Ohio — Photos _ Apartment Therapy.jpg" alt="the house">

            </figure>
            <nav><img src="/img/Tour a Charming Queen Anne House in Defiance, Ohio — Photos _ Apartment Therapy.jpg" alt="hose" style="width: 50px; height:auto;"></nav>
            <h3>Ratings</h3>
            <div class="rating-display">

            <span class="star filled">★</span>
            <span class="star filled">★</span>
            <span class="star filled">★</span>
            <span class="star">☆</span>
            <span class="star">☆</span>
            <span class="rating-number">4.0/5</span>
        </div>
        </div>
        <div class="property-main-right">
            <h3>Our location in maps</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d947.7065295225154!2d6.615152032879264!3d36.96940993151309!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1shouse%20for%20rent%20in%20algeria!5e0!3m2!1sen!2sdz!4v1787853767949!5m2!1sen!2sdz" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <button id="enroll-property">
                enroll now!
                <div class="underline"></div>
            </button>
            <nav class="property-info">
                <h3>Property informations</h3>
                <ul>
                    <li>Oran</li>
                    <li>For Rent</li>
                    <li>100,000 DZD</li>
                </ul>
            </nav>
        </div>
    </main>
    <div class="settings-menu" >
        <nav>
            <h1>Settings</h1>
            <button id="exit-settings-menu"><img src="/img/exit.png" alt="exit" ></button>
        </nav>
       
        <hr>
        <nav>
        <label for="language">choose language</label>
        <select name="language" id="language">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
            <option value="fr">French</option>
        </select>
        </nav>
        <nav>
        <label for="display">Display</label>
        <select name="display" id="display">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
        </nav>
        <hr>
        <div class="pfp-settings"><img src="/img/hiii hello.jpg" alt="Profile Picture">
            <p>Account</p>
        </div>
        
        <h3>
            switch job
        </h3>
        <nav id="settings-job-nav">
            <button>seller</button>
            <button>consumer</button>
        </nav>
        <button id="log-out">Log out</button>
        
    </div>
    <script src="./js/pages.js"></script> 
</body>
</html>
